<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="LawCyBUG terminal animation">
<title>LawCyBUG autonomous run — terminal preview</title>
<rect width="640" height="240" rx="12" fill="#0d1117" stroke="#39ff88" stroke-opacity="0.35"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/>
<circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="18" r="6" fill="#27c93f"/>
<line x1="0" y1="34" x2="640" y2="34" stroke="#39ff88" stroke-opacity="0.15"/>

<text x="24" y="34" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#e8f6ee" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.000;0.020;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  $ LawCyBUG.exe --target https://your-target.com --auto --go
</text>
<text x="24" y="62" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#25e0ff" opacity="0">
