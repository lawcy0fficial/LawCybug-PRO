</text>
<text x="24" y="174" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#39ff88" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.650;0.670;1" dur="9s" begin="0s" repeatCount="indefinite"/>
