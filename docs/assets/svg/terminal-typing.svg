  [*] Loading 41 detector modules ...
</text>
<text x="24" y="90" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#25e0ff" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.260;0.280;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  [*] AI Adaptive Exploit Engine: ONLINE
</text>
<text x="24" y="118" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#25e0ff" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.390;0.410;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  [*] ChainGuard Safe Mode: ENFORCED
</text>
<text x="24" y="146" font-family="'Consolas','Courier New',monospace" font-size="15" fill="#39ff88" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.540;1" dur="9s" begin="0s" repeatCount="indefinite"/>
