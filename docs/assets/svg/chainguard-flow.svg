<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="ChainGuard Safe Mode gating flow">
<title>ChainGuard — Safe Mode gating for every mutating call</title>
<rect width="760" height="200" fill="#0a0e14" rx="12"/>
<g font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee">
  <rect x="20" y="80" width="140" height="46" rx="8" fill="#0d1117" stroke="#25e0ff" stroke-width="1.6"/>
  <text x="90" y="108" text-anchor="middle">Detector /</text>
  <text x="90" y="122" text-anchor="middle">AI Tool call</text>

  <rect x="220" y="80" width="160" height="46" rx="8" fill="#0d1117" stroke="#39ff88" stroke-width="1.8">
    <animate attributeName="stroke" values="#39ff88;#ff3df0;#39ff88" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="300" y="102" text-anchor="middle" font-weight="700">beginChain()</text>
  <text x="300" y="118" text-anchor="middle">canAfford() ?</text>

  <rect x="440" y="30" width="150" height="44" rx="8" fill="#0d1117" stroke="#39ff88" stroke-width="1.6"/>
  <text x="515" y="57" text-anchor="middle" fill="#39ff88">allow(method)</text>

  <rect x="440" y="130" width="150" height="44" rx="8" fill="#0d1117" stroke="#ff5566" stroke-width="1.6"/>
  <text x="515" y="157" text-anchor="middle" fill="#ff5566">BLOCKED</text>

  <rect x="640" y="30" width="100" height="44" rx="8" fill="#0d1117" stroke="#25e0ff" stroke-width="1.6"/>
  <text x="690" y="57" text-anchor="middle">sendRequest()</text>

  <path d="M160,103 L220,103" stroke="#39ff88" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380,95 L440,52" stroke="#39ff88" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380,111 L440,152" stroke="#ff5566" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M590,52 L640,52" stroke="#25e0ff" stroke-width="2" marker-end="url(#arrow)">
    <animate attributeName="stroke-dasharray" values="0 200;200 0" dur="1.6s" repeatCount="indefinite"/>
  </path>
</g>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#39ff88"/>
  </marker>
</defs>
</svg>