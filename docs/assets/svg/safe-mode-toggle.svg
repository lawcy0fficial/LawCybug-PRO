<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" width="260" height="90" role="img" aria-label="Safe Mode toggle indicator">
<title>Safe Mode — ChainGuard enforcement</title>
<rect width="260" height="90" rx="12" fill="#0d1117" stroke="#39ff88" stroke-width="1.6"/>
<circle cx="40" cy="45" r="18" fill="none" stroke="#39ff88" stroke-width="2.4">
  <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
</circle>
<path d="M32,45 l6,6 l12,-14" fill="none" stroke="#39ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="38" font-family="'Consolas','Courier New',monospace" font-size="14" font-weight="700" fill="#39ff88">SAFE MODE: ON</text>
<text x="72" y="58" font-family="'Consolas','Courier New',monospace" font-size="11" fill="#aab4c0">ChainGuard gates every mutation</text>
</svg>