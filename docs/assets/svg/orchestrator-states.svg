<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="AutonomousExploitOrchestrator state machine">
<title>AutonomousExploitOrchestrator — state machine</title>
<rect width="760" height="260" fill="#0a0e14" rx="12"/>

<path d="M90,60 Q185.0,46.0 280,60" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="185.0" y="42.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">start()</text>
<path d="M280,60 Q375.0,46.0 470,60" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="375.0" y="42.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">pause()</text>
<path d="M470,60 Q565.0,46.0 660,60" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="565.0" y="42.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">resume()</text>
<path d="M660,60 Q470.0,46.0 280,60" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="470.0" y="42.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">continue</text>
<path d="M280,60 Q280.0,106.0 280,180" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="280.0" y="102.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">startQueue()</text>
<path d="M280,180 Q470.0,166.0 660,180" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="470.0" y="162.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">stopQueue()</text>
<path d="M280,60 Q470.0,106.0 660,180" fill="none" stroke="#ff3df0" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
</path>
<text x="470.0" y="102.0" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="10" fill="#ff3df0">stop()</text>

<g>
  <circle cx="90" cy="60" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.0s" fill="freeze"/>
  </circle>
  <circle cx="90" cy="60" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <text x="90" y="65" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">IDLE</text>
</g>
<g>
  <circle cx="280" cy="60" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  </circle>
  <circle cx="280" cy="60" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="65" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">RUNNING</text>
</g>
<g>
  <circle cx="470" cy="60" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
  </circle>
  <circle cx="470" cy="60" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="470" y="65" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">PAUSED</text>
</g>
<g>
  <circle cx="660" cy="60" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8999999999999999s" fill="freeze"/>
  </circle>
  <circle cx="660" cy="60" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="0.8999999999999999s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="0.8999999999999999s" repeatCount="indefinite"/>
  </circle>
  <text x="660" y="65" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">RESUMING</text>
</g>
<g>
  <circle cx="280" cy="180" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </circle>
  <circle cx="280" cy="180" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="185" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">QUEUEING</text>
</g>
<g>
  <circle cx="660" cy="180" r="42" fill="#0d1117" stroke="#25e0ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </circle>
  <circle cx="660" cy="180" r="42" fill="none" stroke="#39ff88" stroke-width="1.4" opacity="0">
    <animate attributeName="r" values="42;50;42" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="660" y="185" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12.5" fill="#e8f6ee" font-weight="700">STOPPED</text>
</g>
</svg>