<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160" role="img" aria-label="Multi-target queue mode">
<title>startQueue() — sequential per-host autonomous runs</title>
<rect width="700" height="160" fill="#0a0e14" rx="12"/>
<text x="20" y="30" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#ff3df0">startQueue() — sequential, dedicated thread, restores allowlist on completion</text>

<g>
  <rect x="40" y="60" width="180" height="40" rx="8" fill="#0d1117" stroke="#25e0ff" stroke-width="1.4" opacity="0.85"/>
  <text x="130" y="85" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="11.5" fill="#e8f6ee">api.client-a.com</text>
</g>
<g>
  <rect x="240" y="60" width="180" height="40" rx="8" fill="#0d1117" stroke="#25e0ff" stroke-width="1.4" opacity="0.85"/>
  <text x="330" y="85" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="11.5" fill="#e8f6ee">staging.client-b.io</text>
</g>
<g>
  <rect x="440" y="60" width="180" height="40" rx="8" fill="#0d1117" stroke="#25e0ff" stroke-width="1.4" opacity="0.85"/>
  <text x="530" y="85" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="11.5" fill="#e8f6ee">app.client-c.net</text>
</g>
<circle cx="60" cy="80" r="26" fill="none" stroke="#39ff88" stroke-width="2.6">
  <animate attributeName="cx" values="60;260;460;60" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;1" dur="6s" repeatCount="indefinite"/>
</circle>
</svg>